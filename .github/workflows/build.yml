name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Unzip and Build
      run: |
        unzip LGL_Project.zip
        cd Android-Mod-Menu
        chmod +x gradlew
        ./gradlew assembleRelease
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-APK
        path: Android-Mod-Menu/app/build/outputs/apk/release/*.apk

